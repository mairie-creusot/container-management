# Config nginx minimale pour servir apps/web/dist (SPA React/Vite).
# Copiée dans /etc/nginx/conf.d/default.conf par Dockerfile.web.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # --- Compression -------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain
                       text/css
                       text/xml
                       application/javascript
                       application/json
                       application/xml
                       image/svg+xml;

    # --- Assets hashés (Vite génère des noms type app.[hash].js/css) -------
    # Cache long + immutable : un changement de contenu change le nom de
    # fichier, donc pas de risque de servir une version périmée.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Fichiers à nom stable (favicon.svg…) ------------------------------
    # Leur chemin ne change JAMAIS d'une version à l'autre : "immutable"
    # interdisait au navigateur de revalider pendant un an, et une version
    # obsolète survivait à tous les déploiements.
    location ~* \.(?:js|css|woff2?|ttf|otf|png|jpg|jpeg|gif|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # --- Fallback SPA : toute route inconnue sert index.html ---------------
    # index.html ne doit jamais être mis en cache pour que les déploiements
    # soient visibles immédiatement (il référence les assets hashés à jour).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Endpoint de liveness simple pour la HEALTHCHECK Docker / probes K8s.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
