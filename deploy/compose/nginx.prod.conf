# Config nginx de PRODUCTION (compose) — sert la SPA ET relaie /api vers le conteneur api, pour que
# navigateur et API partagent la même origine (le client web appelle "/api" en relatif).
#
# Pourquoi un fichier distinct de deploy/docker/nginx.web.conf : celui-ci est aussi utilisé par
# Kubernetes/Swarm, où le routage de /api est fait par l'ingress. Ce fichier n'est monté que par
# docker-compose.prod.yml, donc il ne change rien à ces déploiements.
#
# Pourquoi PAS Caddy pour cette route : QUAI pilote Caddy en direct et remplace TOUTE sa config à
# chaque publication de sous-domaine (POST /load, voir services/reverseProxy.ts) — une route écrite
# à la main dans le Caddyfile serait effacée à la première utilisation du reverse proxy interne.

# Déclaré au niveau http (les fichiers de conf.d y sont inclus) : sans cette table, la directive
# Connection du relais /api serait vide et les WebSockets (console VNC, logs en direct) casseraient.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Un import d'ISO ou d'image disque passe par cette route : pas de limite de taille ici, le
    # backend applique la sienne (8 Gio, voir routes/nutanix.ts).
    client_max_body_size 0;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    location ~* \.(?:js|css|woff2?|ttf|otf|png|jpg|jpeg|gif|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        # Upgrade/Connection : indispensables pour la console VNC des VMs et les logs en direct,
        # qui passent par des WebSockets sur ces mêmes chemins.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
