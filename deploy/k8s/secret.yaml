# TEMPLATE — ne pas appliquer tel quel en production.
#
# Remplacer chaque "CHANGE_ME" par la vraie valeur avant `kubectl apply`,
# ou générer ce Secret hors dépôt, par exemple :
#
#   kubectl create secret generic quai-api-secrets -n quai \
#     --from-literal=LDAP_BIND_DN='cn=svc-quai,ou=services,dc=lecreusot,dc=fr' \
#     --from-literal=LDAP_BIND_PASSWORD='***' \
#     --from-literal=JWT_SECRET='***'
#
# (ou via un gestionnaire de secrets externe : Sealed Secrets, External
# Secrets Operator, Vault, etc. — à privilégier en production réelle).
apiVersion: v1
kind: Secret
metadata:
  name: quai-api-secrets
  namespace: quai
type: Opaque
stringData:
  LDAP_BIND_DN: "cn=svc-quai,ou=services,dc=lecreusot,dc=fr"
  LDAP_BIND_PASSWORD: "CHANGE_ME"
  # Secret de signature des JWT de session (voir ARCHITECTURE.md, section
  # Authentification LDAP). Nom de variable à confirmer côté @quai/api.
  JWT_SECRET: "CHANGE_ME"
