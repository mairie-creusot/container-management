# Remplacer ghcr.io/OWNER/quai-web par le chemin réel de l'image publiée
# par .github/workflows/build.yml (ghcr.io/<repository_owner>/quai-web).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quai-web
  namespace: quai
  labels:
    app: quai-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quai-web
  template:
    metadata:
      labels:
        app: quai-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # uid de l'utilisateur "nginx" de nginx:1.27-alpine
      containers:
        - name: web
          image: ghcr.io/OWNER/quai-web:latest # TODO: remplacer OWNER
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # nginx écrit son pid/cache dans le conteneur
