# Déploiement de PRODUCTION de QUAI par Docker Compose — images construites depuis les Dockerfile
# de production (deploy/docker/Dockerfile.api et Dockerfile.web), PAS le mode dev à rechargement à
# chaud de docker-compose.dev.yml.
#
# Différence principale avec le dev : AUCUN annuaire LDAP de test. Les services `ldap` et
# `ldap-init` du fichier de dev n'existent que pour simuler un annuaire en local — en production
# QUAI se connecte au VRAI Active Directory de la mairie, via les variables LDAP_* ci-dessous.
#
#   1. cp .env.prod.example .env.prod   (puis renseigner les vraies valeurs)
#   2. docker compose -f deploy/compose/docker-compose.prod.yml --env-file deploy/compose/.env.prod up -d --build
#
# Mise à jour : rejouer la même commande (les images sont reconstruites, les données persistent
# dans le volume quai_data).
#
# RÈGLE À NE PAS CASSER : aucun bind mount d'un fichier DU DÉPÔT ici. Ce fichier est aussi joué par
# la CI GitLab, dont le job tourne dans un conteneur alors que le démon Docker est celui de l'hôte :
# un chemin `./quelque-chose` serait résolu sur l'HÔTE, où le dépôt n'est pas déployé — Docker y
# créerait un répertoire vide, monté à la place du fichier attendu, sans message d'erreur. Toute
# configuration (nginx, Caddyfile) est donc intégrée aux images via des ARG de build. Seul
# /var/run/docker.sock reste monté : c'est une vraie ressource de l'hôte, pas un fichier du dépôt.

name: quai

services:
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
      args:
        # Autorités internes (racine AD CS, certificat auto-signé d'un service interne) en base64 —
        # sans elles, tout appel HTTPS de QUAI vers un service interne échoue avant l'authentification.
        # Vide = image identique à avant. Voir deploy/README.md.
        INTERNAL_CA_BUNDLE_B64: "${INTERNAL_CA_BUNDLE_B64:-}"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Origine réellement servie aux navigateurs (le web et l'API partagent la même origine grâce
      # au relais /api de nginx, voir nginx.prod.conf).
      CORS_ORIGIN: ${QUAI_PUBLIC_URL}
      QUAI_PUBLIC_URL: ${QUAI_PUBLIC_URL}
      JWT_SECRET: ${JWT_SECRET}
      # true dès que QUAI est servi en HTTPS (cas normal en production).
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CONFIG_PATH: /app/data/config.json
      # Chiffre config.json (identifiants Nutanix/HYCU/GLPI/3CX au repos). La PERDRE rend
      # ces configurations illisibles : à sauvegarder hors de la machine.
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY}
      # --- Active Directory RÉEL de la mairie (aucun annuaire de test en production) -------------
      LDAP_URL: ${LDAP_URL}
      LDAP_BIND_DN: ${LDAP_BIND_DN}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD}
      LDAP_SEARCH_BASE: ${LDAP_SEARCH_BASE}
      LDAP_SEARCH_FILTER: ${LDAP_SEARCH_FILTER}
      LDAP_GROUP_ROLE_MAP: ${LDAP_GROUP_ROLE_MAP}
      LDAP_DEFAULT_ROLE: ${LDAP_DEFAULT_ROLE:-viewer}
    volumes:
      # Données persistantes : config.json chiffré, secrets, journal d'audit, catalogue de
      # templates, workspaces Infra-as-code, positions du graphe. Le Dockerfile crée /app/data
      # possédé par l'utilisateur non-root "node", dont le volume hérite au premier montage.
      - quai_data:/app/data
      # Accès au démon Docker de l'hôte : c'est l'objet même de QUAI (gestion des conteneurs).
      # Équivaut à un accès root sur l'hôte — n'exposez jamais l'API directement à Internet.
      - /var/run/docker.sock:/var/run/docker.sock
    # L'image de production tourne sous l'utilisateur non root "node" : sans appartenir au groupe
    # propriétaire du socket, elle ne peut pas lire /var/run/docker.sock et QUAI croit le démon
    # absent. DOCKER_GID est relevé sur l'hôte au moment du déploiement (voir .gitlab-ci.yml) ;
    # le défaut 999 est celui de Debian/Ubuntu, ajustez-le pour un déploiement à la main.
    group_add:
      - "${DOCKER_GID:-999}"
    networks:
      - quai
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
      args:
        # Config nginx COPIÉE dans l'image (voir Dockerfile.web) : ajoute le relais /api -> api:3000
        # (même origine) et le passage des WebSockets (console VNC des VMs, logs en direct). Le
        # défaut du Dockerfile reste deploy/docker/nginx.web.conf, pour Kubernetes/Swarm.
        WEB_NGINX_CONF: deploy/compose/nginx.prod.conf
    restart: unless-stopped
    ports:
      - "${QUAI_HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - quai
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Reverse proxy interne piloté par QUAI (publication de sous-domaines pour les applications
  # déployées) : même rôle qu'en dev — QUAI pousse toute sa configuration en JSON sur l'API
  # d'administration (:2019, jamais exposée à l'hôte). Le Caddyfile ne sert qu'à démarrer le
  # process avec cette API joignable depuis le réseau interne ; n'y écrivez aucune route à la
  # main, elle serait effacée au premier push (POST /load remplace toute la configuration).
  caddy:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.caddy
      args:
        CADDY_CONF: deploy/compose/caddy/Caddyfile
    restart: unless-stopped
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    # Ports paramétrables : sur la machine qui héberge aussi GitLab, 80 et 443 sont souvent déjà
    # pris — `docker compose up` échouerait alors sur « port is already allocated ». Choisir par
    # exemple 8081/8443 dans le .env de production dans ce cas.
    ports:
      - "${QUAI_PROXY_HTTP_PORT:-80}:80"
      - "${QUAI_PROXY_HTTPS_PORT:-443}:443"
    networks:
      - quai
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  quai:
    driver: bridge

volumes:
  quai_data:
  caddy_data:
  caddy_config:
